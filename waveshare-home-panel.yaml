            text_color: !lambda |-
              if (x < 500.0f) return lv_color_hex(0x63C895);
              if (x < 2000.0f) return lv_color_hex(0xF1C75B);
              return lv_color_hex(0xEF6A6A);

        - lvgl.label.update:
            id: energy_page_power_label
            text_color: !lambda |-
              if (x < 500.0f) return lv_color_hex(0x63C895);
              if (x < 2000.0f) return lv_color_hex(0xF1C75B);
