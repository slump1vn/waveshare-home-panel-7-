  # -------------------------------------------------------------------------
  # Embedded notification audio
  # The media stream is ducked while each announcement plays, then restored.
  # -------------------------------------------------------------------------
  - id: play_startup_audio
    mode: restart
    then:
      - rtttl.stop:
          id: panel_alert_tone
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 18
          duration: 0s
      - media_player.speaker.play_on_device_media_file:
          media_file: startup_ready_sound
          announcement: true
      - wait_until:
          media_player.is_announcing:
            id: panel_media_player
      - wait_until:
          not:
            media_player.is_announcing:
              id: panel_media_player
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 0
          duration: 1500ms

  - id: play_person_audio
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              return id(last_person_audio_ms) == 0 ||
                     (now - id(last_person_audio_ms)) >= 15000;
          then:
            - lambda: 'id(last_person_audio_ms) = millis();'
            - rtttl.stop:
                id: panel_alert_tone
            - mixer_speaker.apply_ducking:
                id: panel_media_input
                decibel_reduction: 20
                duration: 0s
            - media_player.speaker.play_on_device_media_file:
                media_file: person_detected_sound
                announcement: true
            - wait_until:
                media_player.is_announcing:
                  id: panel_media_player
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: panel_media_player
            - mixer_speaker.apply_ducking:
                id: panel_media_input
                decibel_reduction: 0
                duration: 1000ms

  - id: play_alarm_audio
    mode: restart
    then:
      - rtttl.stop:
          id: panel_alert_tone
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 30
          duration: 0s
      - media_player.speaker.play_on_device_media_file:
          media_file: alarm_notification_sound
          announcement: true
      - wait_until:
          media_player.is_announcing:
            id: panel_media_player
      - wait_until:
          not:
            media_player.is_announcing:
              id: panel_media_player
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 0
          duration: 2000ms

  - id: play_high_power_audio
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(alert_active) && id(persistent_alert_type) == 2;'
          then:
            - rtttl.stop:
                id: panel_alert_tone
            - mixer_speaker.apply_ducking:
                id: panel_media_input
                decibel_reduction: 20
                duration: 0s
            - media_player.speaker.play_on_device_media_file:
                media_file: high_power_notification_sound
                announcement: true
            - wait_until:
                condition:
                  or:
                    - media_player.is_announcing:
                        id: panel_media_player
                    - lambda: 'return !id(alert_active);'
                timeout: 2s
            - wait_until:
                condition:
                  or:
                    - not:
                        media_player.is_announcing:
                          id: panel_media_player
                    - lambda: 'return !id(alert_active);'
                timeout: 8s
            - if:
                condition:
                  lambda: 'return !id(alert_active);'
                then:
                  - media_player.stop:
                      id: panel_media_player
            - mixer_speaker.apply_ducking:
                id: panel_media_input
                decibel_reduction: 0
                duration: 0s

  # Repeats the active persistent notification sound until the screen is
  # touched or Home Assistant presses the dismiss button.
  - id: persistent_alert_sound_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(alert_active) && id(persistent_alert_type) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(persistent_alert_type) == 1 && id(alert_active);'
                then:
                  - rtttl.stop:
                      id: panel_alert_tone
                  - if:
                      condition:
                        lambda: 'return id(alert_active) && id(persistent_alert_type) == 1;'
                      then:
                        - rtttl.play:
                            id: panel_alert_tone
                            rtttl: 'parcel:d=16,o=6,b=145:c,e,p,c,e'
                  # Use short delays so dismissal is noticed immediately and
                  # the loop cannot queue another sound after acknowledgement.
                  - repeat:
                      count: 50
                      then:
                        - if:
                            condition:
                              lambda: 'return !id(alert_active) || id(persistent_alert_type) == 0;'
                            then:
                              - script.stop: persistent_alert_sound_loop
                        - delay: 100ms
                else:
                  - if:
                      condition:
                        lambda: 'return id(alert_active) && id(persistent_alert_type) == 2;'
                      then:
                        - script.execute: play_high_power_audio
                  - repeat:
                      count: 100
                      then:
                        - if:
                            condition:
                              lambda: 'return !id(alert_active) || id(persistent_alert_type) == 0;'
                            then:
                              - script.stop: persistent_alert_sound_loop
                        - delay: 100ms

  # One common acknowledgement path for touching the notification or pressing
  # the Home Assistant dismiss control.
  - id: dismiss_persistent_alert
    mode: restart
    then:
      # Clear these first. This prevents the repeat loop from starting another
      # tone while the current audio output is being stopped.
      - lambda: |-
          id(alert_active) = false;
          id(persistent_alert_type) = 0;
      - binary_sensor.template.publish:
          id: alert_active_status
          state: false

      # Stop every alert producer.
      - script.stop: persistent_alert_sound_loop
      - script.stop: play_high_power_audio
      - script.stop: show_parcel_alert
      - script.stop: show_high_power_alert

      # Stop both possible audio paths immediately.
      - rtttl.stop:
          id: panel_alert_tone
      - media_player.stop:
          id: panel_media_player
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 0
          duration: 0s

      # A second stop catches an asynchronous announcement or RTTTL action
      # that was already queued during the touch event.
      - delay: 150ms
      - rtttl.stop:
          id: panel_alert_tone
      - media_player.stop:
          id: panel_media_player
      - mixer_speaker.apply_ducking:
          id: panel_media_input
          decibel_reduction: 0
          duration: 0s

      - lvgl.page.show: home_page
      - script.execute: screen_timeout

  - id: show_person_alert
    mode: restart
    then:
      - script.execute: play_person_audio
      - switch.turn_on: lcd_backlight
      - lambda: |-
          id(alert_active) = true;
          id(alert_count) += 1;
          id(last_alert_name) = "Person detected";
      - binary_sensor.template.publish:
