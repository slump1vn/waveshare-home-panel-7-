text_sensor:
  - platform: homeassistant
    id: home_bin_collection
    entity_id: ${bin_collection_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: home_bin_collection_label
            text: !lambda |-
              if (x.empty() || x == "unknown" || x == "unavailable") {
                return std::string("COLLECTION: WAITING");
              }
              std::string value = x;
              for (auto &character : value) {
                character = static_cast<char>(toupper(character));
              }
              return std::string("COLLECTION: ") + value;
            text_color: !lambda |-
              std::string value = x;
              for (auto &character : value) {
                character = static_cast<char>(tolower(character));
              }
              if (value.find("today") != std::string::npos) {
                return lv_color_hex(0xEF6A6A);
              }
              if (value.find("tomorrow") != std::string::npos) {
                return lv_color_hex(0xF1C75B);
              }
              return lv_color_hex(0xC7D5DF);

  - platform: homeassistant
    id: home_bin_type
    entity_id: ${bin_type_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: home_bin_type_label
            text: !lambda |-
              if (x.empty() || x == "unknown" || x == "unavailable") {
                return std::string("BIN TYPE: WAITING");
              }
              std::string value = x;
              for (auto &character : value) {
                character = static_cast<char>(toupper(character));
              }
              return std::string("BIN TYPE: ") + value;
            text_color: !lambda |-
              std::string value = x;
              for (auto &character : value) {
                character = static_cast<char>(tolower(character));
              }
              if (value.find("recycl") != std::string::npos) {
                return lv_color_hex(0x43F58A);
              }
              if (value.find("garden") != std::string::npos ||
                  value.find("brown") != std::string::npos) {
                return lv_color_hex(0xC99868);
              }
              if (value.find("paper") != std::string::npos ||
                  value.find("blue") != std::string::npos) {
                return lv_color_hex(0x38D9FF);
              }
              if (value.find("food") != std::string::npos ||
                  value.find("orange") != std::string::npos) {
                return lv_color_hex(0xFF9D55);
              }
              if (value.find("glass") != std::string::npos ||
                  value.find("purple") != std::string::npos) {
                return lv_color_hex(0x9B7CFF);
              }
              if (value.find("general") != std::string::npos ||
                  value.find("refuse") != std::string::npos ||
                  value.find("black") != std::string::npos) {
