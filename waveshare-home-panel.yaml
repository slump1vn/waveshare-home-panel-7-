interval:
  # Smoothly glide the home-page analogue power needle towards the latest
  # Home Assistant reading instead of jumping immediately.
  - interval: 100ms
    then:
      - lambda: |-
          const float target = id(home_power_target_watts);
          float displayed = id(home_power_displayed_watts);
          const float difference = target - displayed;

          if (fabsf(difference) < 1.0f) {
            displayed = target;
          } else {
            displayed += difference * 0.20f;
          }

          if (displayed < 0.0f) displayed = 0.0f;
          if (displayed > 6000.0f) displayed = 6000.0f;
          id(home_power_displayed_watts) = displayed;

      - lvgl.indicator.update:
          id: home_energy_needle
          value: !lambda 'return (int) id(home_power_displayed_watts);'

  # Apply scheduled quiet hours once per minute. Supports schedules that
  # cross midnight, for example 22:00 until 07:00.
  - interval: 60s
    then:
      - if:
          condition:
            switch.is_on: scheduled_quiet_hours
          then:
            - lambda: |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return;

                const int start_hour = (int) id(quiet_hours_start).state;
                const int end_hour = (int) id(quiet_hours_end).state;
                const int hour = now.hour;

                bool quiet_now;
                if (start_hour == end_hour) {
                  quiet_now = true;
                } else if (start_hour < end_hour) {
                  quiet_now = hour >= start_hour && hour < end_hour;
                } else {
                  quiet_now = hour >= start_hour || hour < end_hour;
                }

                if (quiet_now && !id(do_not_disturb).state) {
                  id(do_not_disturb).turn_on();
                } else if (!quiet_now && id(do_not_disturb).state) {
                  id(do_not_disturb).turn_off();
                }

