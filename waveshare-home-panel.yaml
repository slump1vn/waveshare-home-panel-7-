        - lvgl.widget.update:
            id: energy_segment_5
            bg_color: 0xF1C75B
            bg_opa: !lambda 'return x >= 1250.0f ? LV_OPA_COVER : LV_OPA_20;'
        - lvgl.widget.update:
            id: energy_segment_6
            bg_color: 0xF1C75B
            bg_opa: !lambda 'return x >= 1500.0f ? LV_OPA_COVER : LV_OPA_20;'
        - lvgl.widget.update:
            id: energy_segment_7
            bg_color: 0xF1C75B
            bg_opa: !lambda 'return x >= 1750.0f ? LV_OPA_COVER : LV_OPA_20;'
        - lvgl.widget.update:
            id: energy_segment_8
            bg_color: 0xEF6A6A
            bg_opa: !lambda 'return x >= 2000.0f ? LV_OPA_COVER : LV_OPA_20;'
        - lvgl.widget.update:
            id: energy_segment_9
            bg_color: 0xEF6A6A
            bg_opa: !lambda 'return x >= 2250.0f ? LV_OPA_COVER : LV_OPA_20;'
        - lvgl.widget.update:
            id: energy_segment_10
            bg_color: 0xEF6A6A
            bg_opa: !lambda 'return x >= 2500.0f ? LV_OPA_COVER : LV_OPA_20;'

        - if:
            condition:
              lambda: 'return id(energy_alerts_enabled).state && !id(do_not_disturb).state && !id(maintenance_mode).state && !id(alert_active) && x >= id(high_power_threshold_watts) && !id(high_power_alert_latched);'
            then:
              - lambda: 'id(high_power_alert_latched) = true;'
              - script.execute: show_high_power_alert

        - if:
