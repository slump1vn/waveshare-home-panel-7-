            condition:
              and:
                - switch.is_on: parcel_alerts_enabled
                - switch.is_off: do_not_disturb
                - switch.is_off: maintenance_mode
            then:
              - script.execute: show_parcel_alert
    on_release:
      then:
        - lvgl.image.update:
            id: home_parcel_icon
            image_recolor: 0x71889A
            image_recolor_opa: COVER
        - lvgl.widget.hide: floor_parcel_pulse

  - platform: homeassistant
    id: doorbell_state
    entity_id: ${doorbell_entity}
    on_press:
      then:
        - lvgl.widget.show: floor_doorbell_pulse
        - lvgl.widget.update:
            id: floor_garage_zone
            border_color: 0x38D9FF
            border_width: 4
        - if:
            condition:
              and:
                - switch.is_on: doorbell_alerts_enabled
                - switch.is_off: do_not_disturb
                - switch.is_off: maintenance_mode
            then:
              - script.execute: show_doorbell_alert
    on_release:
      then:
        - lvgl.widget.hide: floor_doorbell_pulse
        - lvgl.widget.update:
            id: floor_garage_zone
            border_color: 0x2E5978
            border_width: 2

