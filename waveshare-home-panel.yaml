  - platform: online_image
    id: active_camera_frame
    url: "${home_assistant_url}/api/camera_proxy/${cua_truoc_camera_entity}"
    request_headers:
      Authorization: !secret ha_camera_authorization
      Accept: "image/jpeg"
      Cache-Control: "no-cache"
    format: JPEG
    type: RGB565
    byte_order: big_endian
    resize: 640x320
    update_interval: never
    buffer_size: 65535

    on_download_finished:
      then:
        - logger.log:
            level: INFO
            format: "Camera JPEG downloaded successfully"
        - lvgl.image.update:
            id: active_camera_widget
            src: active_camera_frame
        - lvgl.widget.redraw:
            id: active_camera_widget
        - lvgl.label.update:
            id: active_camera_status
            text: "LIVE FRAME UPDATED"
            text_color: 0x63C895

    on_error:
      then:
        - logger.log:
            level: ERROR
            format: "Camera download or JPEG decode failed"
        - lvgl.label.update:
            id: active_camera_status
            text: "FAILED: TOKEN, ENTITY OR JPEG"
            text_color: 0xEF6A6A

