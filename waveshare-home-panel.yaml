        - lvgl.widget.update:
            id: floor_garage_zone
            border_color: 0xFFFFFF
            border_width: 4
        - if:
            condition:
              and:
                - switch.is_on: person_alerts_enabled
                - switch.is_off: do_not_disturb
                - switch.is_off: maintenance_mode
                - lambda: 'return !id(alert_active);'
            then:
              - script.execute: show_person_alert
    on_release:
      then:
        - lvgl.widget.hide: floor_person_pulse
        - lvgl.widget.update:
            id: floor_garage_zone
            border_color: 0x2E5978
            border_width: 2

