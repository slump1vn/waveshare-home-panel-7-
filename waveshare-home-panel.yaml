              return std::string("WIND: ") + x + " km/h";

  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}

    on_value:
      then:
        - lvgl.label.update:
            id: screensaver_weather_condition
            text: !lambda |-
              if (x == "clear-night") return std::string("CLEAR NIGHT");
              if (x == "sunny") return std::string("SUNNY");
              if (x == "partlycloudy") return std::string("PARTLY CLOUDY");
              if (x == "cloudy") return std::string("CLOUDY");
              if (x == "rainy") return std::string("RAIN");
              if (x == "pouring") return std::string("HEAVY RAIN");
              if (x == "lightning-rainy") return std::string("THUNDERSTORM");
              if (x == "fog") return std::string("FOG");
              std::string value = x;
              for (auto &character : value) character = toupper(character);
              return value;

        - lvgl.label.update:
            id: screensaver_weather_icon
            text: !lambda |-
              if (x == "sunny") return std::string("☀");
              if (x == "clear-night") return std::string("◐");
              if (x == "rainy" || x == "pouring") return std::string("☂");
              if (x == "lightning" || x == "lightning-rainy") return std::string("⚡");
              if (x == "snowy" || x == "snowy-rainy" || x == "hail") return std::string("❄");
              return std::string("☁");
            text_color: !lambda |-
              if (x == "sunny") return lv_color_hex(0x6B5A2C);
              if (x == "clear-night") return lv_color_hex(0x40596B);
              if (x == "rainy" || x == "pouring") return lv_color_hex(0x31586C);
              if (x == "lightning" || x == "lightning-rainy") return lv_color_hex(0x6B5A2C);
              if (x == "snowy" || x == "snowy-rainy" || x == "hail") return lv_color_hex(0x536875);
              return lv_color_hex(0x46525C);

        - lvgl.label.update:
            id: home_weather_icon
            text: !lambda |-
              if (x == "sunny") return std::string("☀");
              if (x == "clear-night") return std::string("◐");
              if (x == "rainy" || x == "pouring") return std::string("☂");
              if (x == "lightning" || x == "lightning-rainy") return std::string("⚡");
              if (x == "snowy" || x == "snowy-rainy" || x == "hail") return std::string("❄");
              return std::string("☁");
            text_color: !lambda |-
              if (x == "sunny") return lv_color_hex(0xF1C75B);
              if (x == "clear-night") return lv_color_hex(0x8DB7FF);
              if (x == "rainy" || x == "pouring") return lv_color_hex(0x43F58A);
              if (x == "lightning" || x == "lightning-rainy") return lv_color_hex(0xFFD45C);
              if (x == "snowy" || x == "snowy-rainy" || x == "hail") return lv_color_hex(0xDCEEFF);
              return lv_color_hex(0xAAB7C4);

        - lvgl.label.update:
            id: weather_page_condition
            text: !lambda |-
              if (x == "clear-night") return std::string("CLEAR NIGHT");
              if (x == "sunny") return std::string("SUNNY");
              if (x == "partlycloudy") return std::string("PARTLY CLOUDY");
              if (x == "cloudy") return std::string("CLOUDY");
              if (x == "rainy") return std::string("RAIN");
              if (x == "pouring") return std::string("HEAVY RAIN");
              if (x == "lightning" || x == "lightning-rainy") return std::string("THUNDERSTORM");
              if (x == "snowy" || x == "snowy-rainy") return std::string("SNOW");
              if (x == "fog") return std::string("FOG");
              if (x == "windy" || x == "windy-variant") return std::string("WINDY");
              if (x == "hail") return std::string("HAIL");
              return std::string("CURRENT WEATHER");

        - if:
            condition:
              lambda: 'return x == "sunny";'
            then:
              - lvgl.image.update:
                  id: weather_page_main_image
                  src: weather_img_sunny
            else:
              - if:
                  condition:
                    lambda: 'return x == "clear-night";'
                  then:
                    - lvgl.image.update:
                        id: weather_page_main_image
                        src: weather_img_night
                  else:
                    - if:
                        condition:
                          lambda: 'return x == "partlycloudy";'
                        then:
                          - lvgl.image.update:
                              id: weather_page_main_image
                              src: weather_img_partly_cloudy
                        else:
                          - if:
                              condition:
                                lambda: 'return x == "rainy" || x == "pouring";'
                              then:
                                - lvgl.image.update:
                                    id: weather_page_main_image
                                    src: weather_img_rain
                              else:
                                - if:
                                    condition:
                                      lambda: 'return x == "lightning" || x == "lightning-rainy";'
                                    then:
                                      - lvgl.image.update:
                                          id: weather_page_main_image
                                          src: weather_img_storm
                                    else:
                                      - if:
                                          condition:
                                            lambda: 'return x == "snowy" || x == "snowy-rainy" || x == "hail";'
                                          then:
                                            - lvgl.image.update:
                                                id: weather_page_main_image
                                                src: weather_img_snow
                                          else:
                                            - lvgl.image.update:
                                                id: weather_page_main_image
                                                src: weather_img_cloudy

        - lvgl.label.update:
            id: weather_condition_label
            text: !lambda |-
              if (x == "clear-night") {
                return std::string("CLEAR NIGHT");
              }

              if (x == "sunny") {
                return std::string("SUNNY");
              }

              if (x == "partlycloudy") {
                return std::string("PARTLY CLOUDY");
              }

              if (x == "cloudy") {
                return std::string("CLOUDY");
              }

              if (x == "rainy") {
                return std::string("RAIN");
              }

              if (x == "pouring") {
                return std::string("HEAVY RAIN");
              }

              if (x == "lightning-rainy") {
                return std::string("THUNDERSTORM");
              }

              if (x == "fog") {
                return std::string("FOG");
              }

              std::string value = x;

              for (auto &character : value) {
                character = toupper(character);
              }

              return value;

