          text_color: 0xC39BFF
      - lvgl.label.update:
          id: notification_dismiss_hint
          text: "THIS ALERT WILL CLOSE AUTOMATICALLY"
          text_color: 0x9BA8B4
      - lvgl.page.show: notification_page
      - delay: 8s
      - lambda: 'id(alert_active) = false;'
