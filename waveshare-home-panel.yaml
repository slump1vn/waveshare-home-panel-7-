    id: refresh_cameras_ha
    name: "Refresh Camera Images"
    icon: "mdi:camera-refresh"
    entity_category: diagnostic
    on_press:
      then:
        - script.execute: refresh_cameras

  - platform: template
    id: wake_screen_ha
    name: "Wake Screen"
    icon: "mdi:monitor"
    entity_category: config
    on_press:
      then:
        - script.execute: screen_timeout

  - platform: template
    id: dismiss_alert_ha
    name: "Dismiss Current Alert"
    icon: "mdi:notification-clear-all"
    entity_category: config
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(persistent_alert_type) != 0;'
            then:
              - script.execute: dismiss_persistent_alert
            else:
              - script.stop: show_person_alert
              - script.stop: show_doorbell_alert
              - script.stop: show_alarm_alert
              - lambda: 'id(alert_active) = false;'
              - binary_sensor.template.publish:
                  id: alert_active_status
                  state: false
              - lvgl.page.show: home_page
              - script.execute: screen_timeout

  - platform: template
    id: reset_alert_history_ha
    name: "Reset Alert History"
    icon: "mdi:history-remove"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            id(alert_count) = 0;
            id(last_alert_name) = "None";
        - sensor.template.publish:
            id: alert_count_status
            state: 0
        - text_sensor.template.publish:
            id: last_alert_status
            state: "None"

select:
  - platform: template
    id: screen_timeout_select
    name: "Screen Timeout"
    icon: "mdi:timer-cog-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "1 minute"
      - "5 minutes"
      - "15 minutes"
      - "Always on"
    initial_option: "5 minutes"
    set_action:
      then:
        - lambda: |-
            if (x == "1 minute") {
              id(screen_always_on) = false;
              id(screen_timeout_seconds) = 60;
            } else if (x == "5 minutes") {
              id(screen_always_on) = false;
              id(screen_timeout_seconds) = 300;
            } else if (x == "15 minutes") {
              id(screen_always_on) = false;
              id(screen_timeout_seconds) = 900;
            } else {
              id(screen_always_on) = true;
            }
        - script.execute: screen_timeout


