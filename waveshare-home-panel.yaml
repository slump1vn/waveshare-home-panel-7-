substitutions:
  device_name: waveshare-home-panel
  friendly_name: Waveshare Home Panel

  weather_entity: weather.met_office_herne_bay
  outside_temperature_entity: sensor.indoor_outdoor_meter_0b33_temperature
  outside_humidity_entity: sensor.outside_humidity

  light_1_entity: switch.extractor_fan_sonoff_10028d1d54_1
  light_2_entity: light.bedroom_lamp
  light_3_entity: light.table_light
  light_4_entity: light.tall_light

  switch_1_entity: switch.garden_lights
  switch_2_entity: switch.drive_lights
  switch_3_entity: switch.shed_power_switch

  alarm_entity: alarm_control_panel.alarmo
  front_door_entity: binary_sensor.front_door
  garage_entity: binary_sensor.motion_sensor_end_of_drive_motion
  person_detected_entity: binary_sensor.front_door_person
  parcel_detected_entity: binary_sensor.parcel_box_door
  doorbell_entity: binary_sensor.front_door_visitor
  high_power_alert_threshold: "2500"

  # Direct station used by the on-screen radio preset.
  # Home Assistant Radio Browser can send any station to the panel.
  radio_url: "https://stream.live.vc.bbcmedia.co.uk/bbc_radio_two"

  energy_power_entity: sensor.octopus_energy_electricity_19l2684622_1900020180827_current_demand
  indoor_temperature_entity: sensor.workshop_parcel_box_notification_aht20_temperature
  bin_collection_entity: sensor.home_general
  bin_type_entity: sensor.home_general_bin_type

  # Presence entities used by the Version 26 House Overview page.
  person_1_entity: person.darren
  person_2_entity: person.anastasiia
  sun_entity: sun.sun

  # Camera proxy settings.
  # Keep the Home Assistant token in esphome/secrets.yaml as:
  # ha_camera_authorization: "Bearer YOUR_LONG_LIVED_ACCESS_TOKEN"
  home_assistant_url: "https://180.elmarspices.com:8123"
  # Frigate camera entities (matches the Frigate integration on Home Assistant).
  cua_truoc_camera_entity: "camera.cua_truoc"
  ngoai_ngo_camera_entity: "camera.ngoai_ngo"
  nha_phia_sau_camera_entity: "camera.nha_phia_sau"
  san_thuong_camera_entity: "camera.san_thuong_2"
  tang_2_camera_entity: "camera.tang_2"

# ================================================================
# VERSION 106.1 MATCHING STATIC FORECAST ICONS - COMPILE FIX
# Adds a full-screen weather page inspired by the supplied layout.
# Version 97 embedded audio, entities, cameras and alerts are retained.
# ================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0

  project:
    name: darren.waveshare_dashboard
    version: "120-modern-startup-audio"

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - switch.turn_on: lcd_backlight
      - lvgl.page.show: startup_page
      - lvgl.label.update:
          id: startup_status_label
          text: "STARTING DISPLAY"
      - lvgl.bar.update:
          id: startup_progress_bar
          value: 20
      - delay: 350ms
      - lvgl.label.update:
          id: startup_status_label
          text: "CONNECTING HOME ASSISTANT"
      - lvgl.bar.update:
          id: startup_progress_bar
          value: 48
      - delay: 450ms
      - lvgl.label.update:
          id: startup_status_label
          text: "LOADING DASHBOARD"
      - lvgl.bar.update:
          id: startup_progress_bar
          value: 76
      - delay: 450ms
      - lvgl.label.update:
          id: startup_status_label
          text: "READY"
          text_color: 0x63C895
      - lvgl.bar.update:
          id: startup_progress_bar
          value: 100
          indicator:
            bg_color: 0x63C895
      - delay: 450ms
      - lvgl.page.show: home_page
      - script.execute: play_startup_audio
      - script.execute: screen_timeout

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

  framework:
    type: esp-idf
    # Keep code in flash and use a larger PSRAM cache line so the RGB frame
    # buffer is not starved of PSRAM bandwidth (prevents screen flicker).
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE_64B: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  hardware_uart: UART0

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min

  ap:
    ssid: "${friendly_name} Setup"
    password: "ChangeMe123"

captive_portal:

http_request:
  timeout: 20s
  verify_ssl: false
  follow_redirects: true
  redirect_limit: 4
  buffer_size_rx: 65535

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/London

    on_time:
      - seconds: /1
        then:
          - lvgl.label.update:
              id: header_time
              text: !lambda |-
                auto now = id(ha_time).now();

                if (!now.is_valid()) {
                  return std::string("--:--");
                }

                return now.strftime("%H:%M:%S");

          - lvgl.label.update:
              id: header_greeting
              text: !lambda |-
                auto now = id(ha_time).now();

                if (!now.is_valid()) {
                  return std::string("WELCOME HOME");
                }

                const int hour = now.hour;
                if (hour < 12) {
                  return std::string("GOOD MORNING");
                }
                if (hour < 18) {
                  return std::string("GOOD AFTERNOON");
                }
                return std::string("GOOD EVENING");

          - lvgl.label.update:
              id: large_clock
              text: !lambda |-
                auto now = id(ha_time).now();

                if (!now.is_valid()) {
                  return std::string("--:--");
                }

                return now.strftime("%H:%M");

          - lvgl.label.update:
              id: large_date
              text: !lambda |-
                auto now = id(ha_time).now();

                if (!now.is_valid()) {
                  return std::string("WAITING FOR HOME ASSISTANT");
                }

                return now.strftime("%A, %d %B");

          - lvgl.label.update:
              id: weather_page_clock
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--:--");
                return now.strftime("%H:%M");

          - lvgl.label.update:
              id: weather_page_date
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--- --");
                return now.strftime("%b %d");

          - lvgl.label.update:
              id: weather_page_day
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("---");
                std::string day = now.strftime("%A");
                for (auto &c : day) c = toupper(c);
                return day;

          - lvgl.label.update:
              id: screensaver_clock
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("--:--");
                return now.strftime("%H:%M");

          - lvgl.label.update:
              id: screensaver_date
              text: !lambda |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return std::string("WAITING FOR TIME");
                return now.strftime("%A, %d %B");

          - if:
              condition:
                lambda: |-
                  auto now = id(ha_time).now();
                  return now.is_valid() && now.second == 0;
              then:
                - lvgl.widget.update:
                    id: screensaver_content
                    x: !lambda |-
                      auto now = id(ha_time).now();
                      static const int offsets[] = {-12, -6, 0, 6, 12, 6, 0, -6};
                      return offsets[now.minute % 8];
                    y: !lambda |-
                      auto now = id(ha_time).now();
                      static const int offsets[] = {-6, 0, 6, 0};
                      return offsets[now.minute % 4];


# ---------------------------------------------------------------------------
# Version 28 media player — Sunton ESP32-8048S070 connections
# MAX98357A BCLK -> GPIO12 (TF card slot pins; free when no SD card is used)
# MAX98357A LRC  -> GPIO11
# MAX98357A DIN  -> GPIO13
# MAX98357A VIN  -> 5V
# MAX98357A GND  -> GND
# ---------------------------------------------------------------------------
i2s_audio:
  - id: panel_i2s
    i2s_bclk_pin: GPIO12
    i2s_lrclk_pin: GPIO11

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: panel_i2s
    dac_type: external
    i2s_dout_pin: GPIO13
    channel: stereo
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 300ms
    timeout: 1s

  - platform: mixer
    id: panel_audio_mixer
    output_speaker: physical_speaker
    source_speakers:
      - id: panel_media_input
      - id: panel_announcement_input

  - platform: resampler
    id: panel_media_resampler
    output_speaker: panel_media_input

  - platform: resampler
    id: panel_announcement_resampler
    output_speaker: panel_announcement_input


rtttl:
  id: panel_alert_tone
  speaker: panel_announcement_resampler
  gain: 85%

media_player:
  - platform: speaker
    id: panel_media_player
    name: "${friendly_name} Media Player"
    icon: "mdi:radio"
    task_stack_in_psram: true
    buffer_size: 1000000
    volume_initial: 45%
    volume_increment: 5%

    # Embedded WAV files. Paths are relative to this YAML file.
    files:
      - id: startup_ready_sound
        file: "sounds/startup_ready.wav"
      - id: person_detected_sound
        file: "sounds/person_detected.wav"
      - id: alarm_notification_sound
        file: "sounds/alarm.wav"
      - id: high_power_notification_sound
        file: "sounds/high_power_warning.wav"

    media_pipeline:
      speaker: panel_media_resampler
      format: FLAC
      sample_rate: 16000
      num_channels: 2

    announcement_pipeline:
      speaker: panel_announcement_resampler
      format: FLAC
      sample_rate: 16000
      num_channels: 1

    on_play:
      - lvgl.label.update:
          id: media_page_state
          text: "PLAYING FROM HOME ASSISTANT"
          text_color: 0x63C895
      - lvgl.label.update:
          id: home_media_state_label
          text: "PLAYING"
          text_color: 0x63C895

    on_pause:
      - lvgl.label.update:
          id: media_page_state
          text: "PAUSED"
          text_color: 0xF1C75B
      - lvgl.label.update:
          id: home_media_state_label
          text: "PAUSED"
          text_color: 0xF1C75B

    on_idle:
      - lvgl.label.update:
          id: media_page_state
          text: "READY - CHOOSE MEDIA IN HOME ASSISTANT"
          text_color: 0xE8EDF2
      - lvgl.label.update:
          id: home_media_state_label
          text: "READY"
          text_color: 0xE8EDF2

    on_announcement:
      - lvgl.label.update:
          id: media_page_state
          text: "ANNOUNCEMENT"
          text_color: 0xF1C75B
      - lvgl.label.update:
          id: home_media_state_label
          text: "ANNOUNCEMENT"
          text_color: 0xF1C75B

    on_volume:
      - lvgl.label.update:
          id: media_volume_label
          text: !lambda |-
            char buffer[24];
            snprintf(buffer, sizeof(buffer), "VOLUME %.0f%%", x * 100.0f);
            return std::string(buffer);
      - lvgl.label.update:
          id: home_media_volume_label
          text: !lambda |-
            char buffer[24];
            snprintf(buffer, sizeof(buffer), "VOLUME %.0f%%", x * 100.0f);
            return std::string(buffer);
      - lvgl.bar.update:
          id: media_volume_bar
          value: !lambda |-
            int volume = (int) roundf(x * 100.0f);
            if (volume < 0) volume = 0;
            if (volume > 100) volume = 100;
            return volume;

i2c:
  id: board_i2c
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz
  scan: true

display:
  - platform: mipi_rgb
    model: ESP32-8048S070
    id: panel_display

    rotation: 0

    # Both display and LVGL use the same byte order.
    byte_order: big_endian

    pclk_frequency: 10MHz
    pclk_inverted: true
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: panel_touch
    display: panel_display
    i2c_id: board_i2c
    reset_pin: GPIO38
    update_interval: 30ms

    on_touch:
      then:
        - if:
            condition:
              lambda: return id(screensaver_active);
            then:
              - lambda: id(screensaver_active) = false;
              - lvgl.page.show: home_page
        - script.execute: screen_timeout

switch:
  - platform: gpio
    id: lcd_backlight
    name: "${friendly_name} Screen"

    restore_mode: ALWAYS_ON

    pin:
      number: GPIO2
      inverted: false

  # Automatic notification controls exposed on the Home Assistant device page.
  - platform: template
    id: person_alerts_enabled
    name: "${friendly_name} Person Alerts"
    icon: "mdi:account-alert"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: parcel_alerts_enabled
    name: "${friendly_name} Parcel Alerts"
    icon: "mdi:package-variant-closed"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: doorbell_alerts_enabled
    name: "${friendly_name} Doorbell Alerts"
    icon: "mdi:doorbell-video"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: alarm_alerts_enabled
    name: "${friendly_name} Alarm Alerts"
    icon: "mdi:shield-alert"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: energy_alerts_enabled
    name: "${friendly_name} High Energy Alerts"
    icon: "mdi:flash-alert"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Suppresses non-critical automatic notifications while enabled.
  # Alarm alerts and manual test buttons still work.
  - platform: template
    id: do_not_disturb
    name: "${friendly_name} Do Not Disturb"
    icon: "mdi:minus-circle-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Automatically controls Do Not Disturb during the configured quiet hours.
  - platform: template
    id: scheduled_quiet_hours
    name: "${friendly_name} Scheduled Quiet Hours"
    icon: "mdi:weather-night"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Maintenance mode keeps the display awake and suppresses non-critical
  # automatic notifications while the panel is being serviced.
  - platform: template
    id: maintenance_mode
    name: "${friendly_name} Maintenance Mode"
    icon: "mdi:tools"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.stop: screen_timeout
        - switch.turn_on: lcd_backlight
        - lvgl.widget.show: maintenance_banner
    on_turn_off:
      then:
        - lvgl.widget.hide: maintenance_banner
        - script.execute: screen_timeout

globals:
  - id: screen_timeout_seconds
    type: int
    restore_value: true
    initial_value: '300'

  - id: screen_always_on
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: high_power_alert_latched
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: high_power_threshold_watts
    type: float
    restore_value: true
    initial_value: '${high_power_alert_threshold}'

  - id: alert_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Persistent alert currently shown:
  # 0 = none, 1 = parcel, 2 = high energy.
  - id: persistent_alert_type
    type: int
    restore_value: false
    initial_value: '0'

  - id: alert_count
    type: int
    restore_value: true
    initial_value: '0'

  - id: last_alert_name
    type: std::string
    restore_value: true
    max_restore_data_length: 48
    initial_value: '"None"'

  - id: selected_camera
    type: int
    restore_value: false
    initial_value: "0"

  - id: screensaver_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: peak_power_since_reset
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: home_power_target_watts
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: home_power_displayed_watts
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: home_weather_motion_phase
    type: bool
    restore_value: false
    initial_value: "false"


  # Prevent the person-detected MP3 from repeatedly sounding.
  - id: last_person_audio_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  - id: screen_timeout
    mode: restart
    then:
      - switch.turn_on: lcd_backlight
      - lambda: id(screensaver_active) = false;
      - if:
          condition:
            lambda: 'return !id(screen_always_on) && !id(maintenance_mode).state && !id(alert_active);'
          then:
            - delay: 15min
            - lambda: id(screensaver_active) = true;
            - lvgl.page.show: clock_screensaver_page

  - id: refresh_weather_forecast
    mode: restart
    then:
      - lvgl.label.update:
          id: forecast_status_label
          text: "UPDATING MET OFFICE FORECAST..."
          text_color: 0xF1C75B
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                JsonArrayConst forecast =
                  response["response"]["${weather_entity}"]["forecast"].as<JsonArrayConst>();

                auto set_day = [&](int index, lv_obj_t *day_label,
                                   lv_obj_t *icon_image,
                                   lv_obj_t *temperature_label,
                                   lv_obj_t *rain_label) {
                  if (index >= forecast.size()) {
                    lv_label_set_text(day_label, "---");
                    esphome::lvgl::lv_image_set_src(icon_image, id(forecast_img_cloudy));
                    lv_label_set_text(temperature_label, "-- / --°");
                    lv_label_set_text(rain_label, "--%");
                    return;
                  }

                  JsonObjectConst item = forecast[index];
                  const char *datetime = item["datetime"] | "";
                  const char *condition = item["condition"] | "unknown";
                  float high = item["temperature"] | NAN;
                  float low = item["templow"] | NAN;
                  float rain = item["precipitation_probability"] | NAN;

                  std::string day = "---";
                  if (strlen(datetime) >= 10) {
                    struct tm tm{};
                    if (strptime(datetime, "%Y-%m-%d", &tm) != nullptr) {
                      static const char *days[] = {
                        "SUN","MON","TUE","WED","THU","FRI","SAT"
                      };
                      if (tm.tm_wday >= 0 && tm.tm_wday <= 6)
                        day = days[tm.tm_wday];
                    }
                  }

                  std::string cond(condition);
                  esphome::image::Image *forecast_icon = id(forecast_img_cloudy);

                  if (cond == "sunny") {
                    forecast_icon = id(forecast_img_sunny);
                  } else if (cond == "clear-night") {
                    forecast_icon = id(forecast_img_night);
                  } else if (cond == "partlycloudy") {
                    forecast_icon = id(forecast_img_partly_cloudy);
                  } else if (cond.find("lightning") != std::string::npos) {
                    forecast_icon = id(forecast_img_storm);
                  } else if (cond.find("snow") != std::string::npos ||
                             cond.find("hail") != std::string::npos) {
                    forecast_icon = id(forecast_img_snow);
                  } else if (cond.find("rain") != std::string::npos ||
                             cond.find("pouring") != std::string::npos) {
                    forecast_icon = id(forecast_img_rain);
                  } else if (cond.find("cloud") != std::string::npos ||
                             cond == "fog") {
                    forecast_icon = id(forecast_img_cloudy);
                  }

                  char temp_buf[24];
                  if (isnan(high) && isnan(low)) {
                    snprintf(temp_buf, sizeof(temp_buf), "-- / --°");
                  } else if (isnan(low)) {
                    snprintf(temp_buf, sizeof(temp_buf), "%.0f°", high);
                  } else {
                    snprintf(temp_buf, sizeof(temp_buf), "%.0f° / %.0f°", high, low);
                  }

                  char rain_buf[16];
                  if (isnan(rain)) snprintf(rain_buf, sizeof(rain_buf), "--%%");
                  else snprintf(rain_buf, sizeof(rain_buf), "%.0f%%", rain);

                  lv_label_set_text(day_label, day.c_str());
                  esphome::lvgl::lv_image_set_src(icon_image, forecast_icon);
                  lv_label_set_text(temperature_label, temp_buf);
                  lv_label_set_text(rain_label, rain_buf);
                };

                set_day(0, id(forecast_day_1), id(forecast_icon_1),
                        id(forecast_temperature_1), id(forecast_rain_1));
                set_day(1, id(forecast_day_2), id(forecast_icon_2),
                        id(forecast_temperature_2), id(forecast_rain_2));
                set_day(2, id(forecast_day_3), id(forecast_icon_3),
                        id(forecast_temperature_3), id(forecast_rain_3));
                set_day(3, id(forecast_day_4), id(forecast_icon_4),
                        id(forecast_temperature_4), id(forecast_rain_4));
                set_day(4, id(forecast_day_5), id(forecast_icon_5),
                        id(forecast_temperature_5), id(forecast_rain_5));
            - lvgl.label.update:
                id: forecast_status_label
                text: "MET OFFICE • 5 DAY FORECAST"
                text_color: 0x63C895
          on_error:
            - lvgl.label.update:
                id: forecast_status_label
                text: "FORECAST UPDATE FAILED"
                text_color: 0xEF6A6A

  - id: refresh_cameras
    mode: restart
    then:
      - lvgl.label.update:
          id: active_camera_status
          text: "REFRESHING..."
          text_color: 0xF1C75B
      - online_image.release: active_camera_frame
      - delay: 100ms
      - online_image.set_url:
          id: active_camera_frame
          update: false
          url: !lambda |-
            const char *entity;
            switch (id(selected_camera)) {
              case 1: entity = "${ngoai_ngo_camera_entity}"; break;
              case 2: entity = "${nha_phia_sau_camera_entity}"; break;
              case 3: entity = "${san_thuong_camera_entity}"; break;
              case 4: entity = "${tang_2_camera_entity}"; break;
              default: entity = "${cua_truoc_camera_entity}"; break;
            }
            char url[384];
            snprintf(
              url,
              sizeof(url),
              "${home_assistant_url}/api/camera_proxy/%s?cache=%lu",
              entity,
              (unsigned long) millis()
            );
            return std::string(url);
      - component.update: active_camera_frame
      - script.execute: screen_timeout

  - id: select_camera_cua_truoc
    mode: restart
    then:
      - lambda: id(selected_camera) = 0;
      - lvgl.label.update:
          id: active_camera_title
          text: "CUA TRUOC"
      - lvgl.label.update:
          id: active_camera_status
          text: "REQUESTING CUA TRUOC..."
          text_color: 0xF1C75B
      - online_image.release: active_camera_frame
      - delay: 100ms
      - online_image.set_url:
          id: active_camera_frame
          update: false
          url: !lambda |-
            char url[384];
            snprintf(
              url,
              sizeof(url),
              "${home_assistant_url}/api/camera_proxy/${cua_truoc_camera_entity}?cache=%lu",
